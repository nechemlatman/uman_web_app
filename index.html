<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a2a52" />
  <title>Uman Event Manager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img"><path d="M32 5 12 19v30l20 10 20-10V19L32 5Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M22 32v16m20-16v16M22 32h20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M32 13c4 5 6 9 0 15-6-6-4-10 0-15Z" fill="#c99b45"/></svg>
        </div>
        <div class="brand-copy">
          <strong>Uman Event Manager</strong>
          <span>PEOPLE · JOURNEY · PURPOSE</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="langToggle" class="segmented" aria-label="שינוי שפה"><span data-lang="en">EN</span><span data-lang="he">עברית</span></button>
        <button id="quickAdd" class="icon-btn" title="הוספה מהירה" aria-label="הוספה מהירה">＋</button>
      </div>
    </header>

    <main id="view" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="ניווט ראשי">
      <button data-route="dashboard" class="nav-item active"><span class="nav-icon">⌂</span><span data-i18n="nav.home">בית</span></button>
      <button data-route="people" class="nav-item"><span class="nav-icon">👥</span><span data-i18n="nav.people">אנשים</span></button>
      <button data-route="stay" class="nav-item"><span class="nav-icon">⌂</span><span data-i18n="nav.stay">לינה</span></button>
      <button data-route="finance" class="nav-item"><span class="nav-icon">▣</span><span data-i18n="nav.finance">כספים</span></button>
      <button data-route="more" class="nav-item"><span class="nav-icon">•••</span><span data-i18n="nav.more">עוד</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
